name: Build and validate releases

on:
  workflow_dispatch:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

concurrency:
  group: maracuja-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "1"
  CTEST_PARALLEL_LEVEL: "1"

jobs:
  source-privacy:
    uses: ./.github/workflows/source-privacy.yml
  build:
    needs: source-privacy
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: runner.os == 'Linux'
        with:
          python-version: "3.12"
      - name: Determine application version
        shell: python
        run: |
          import os,re,pathlib
          version=re.search(r'project\(Maracuja VERSION ([0-9.]+)',pathlib.Path('CMakeLists.txt').read_text())[1]
          if os.environ['GITHUB_REF_TYPE']=='tag':
              assert os.environ['GITHUB_REF_NAME']=='v'+version,'Tag and CMake version differ'
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('MARACUJA_VERSION='+version+'\n')
      - name: Prepare frozen Ubuntu dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo python3 - <<'PY'
          import pathlib
          p=pathlib.Path('/etc/apt/sources.list.d/ubuntu.sources')
          s=p.read_text().replace('http://azure.archive.ubuntu.com/ubuntu/','https://snapshot.ubuntu.com/ubuntu/20261022T000000Z/').replace('http://archive.ubuntu.com/ubuntu/','https://snapshot.ubuntu.com/ubuntu/20261022T000000Z/').replace('http://security.ubuntu.com/ubuntu/','https://snapshot.ubuntu.com/ubuntu/20261022T000000Z/')
          p.write_text(s+'\nCheck-Valid-Until: no\n')
          PY
          sudo apt-get -o Acquire::Check-Valid-Until=false update
          sudo apt-get install --no-install-recommends -y build-essential cmake ninja-build pkg-config patchelf bubblewrap ffmpeg poppler-utils libtesseract5 libreoffice-writer fonts-dejavu-core fonts-liberation2 qt6-base-dev qt6-declarative-dev qt6-tools-dev qt6-svg-dev qt6-image-formats-plugins libqt6waylandclient6 qt6-wayland qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtquick-layouts qml6-module-qtquick-controls qml6-module-qtquick-templates qml6-module-qtquick-dialogs qml6-module-qtqml-workerscript qml6-module-qtqml-models libwayland-dev wayland-protocols libpango1.0-dev libglib2.0-dev
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Build, validate and package Linux sequentially
        if: runner.os == 'Linux'
        shell: bash
        run: python3 -I packaging/linux/build.py --version "$MARACUJA_VERSION" --appimage
      - name: Build, validate and package Windows sequentially
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./packaging/windows/bootstrap.ps1 -Version $env:MARACUJA_VERSION
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: maracuja-${{ runner.os }}-${{ env.MARACUJA_VERSION }}
          path: dist/artifacts/*
          if-no-files-found: error
          retention-days: 14
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: maracuja-*
          merge-multiple: true
          path: release-assets
      - name: Publish only after both platform jobs pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Maracujá ${GITHUB_REF_NAME#v}" --generate-notes
          gh release upload "$GITHUB_REF_NAME" release-assets/*
          gh release edit "$GITHUB_REF_NAME" --draft=false
